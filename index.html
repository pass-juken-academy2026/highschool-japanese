const PASSAGES={
 classic:{title:"古文の短文",text:"春になりて、庭の梅の花、いと美しく咲きたり。人々、これを見て心を慰めけり。",q:"本文の内容として最も適切なのは？",o:["春に梅が美しく咲き、人々の心を和ませた","冬に梅が枯れ、人々が悲しんだ","人々は庭に行かなかった","梅の花はまだ咲いていなかった"],a:0,e:"「春」「梅の花」「美しく咲きたり」「心を慰めけり」が根拠です。現代語訳の一例：春になって庭の梅の花がとても美しく咲いた。人々はそれを見て心を慰めた。"},
 japanese:{title:"現代文の短文",text:"図書館は本を借りる場所であるだけでなく、静かに考えたり、他者の知識に触れたりする場所でもある。利用する人が互いに配慮することで、その価値はさらに高まる。",q:"本文から読み取れることは？",o:["図書館の価値は本を借りることだけにある","利用者同士の配慮も図書館の価値を高める","図書館では考えごとをしてはいけない","他者の知識に触れる必要はない"],a:1,e:"「互いに配慮することで、その価値はさらに高まる」と述べています。"},
 kanbun:{title:"漢文の短文",text:"学而時習之、不亦説乎。",q:"この文の意味として最も適切なのは？",o:["学んだことを時々復習するのは、なんと喜ばしいことではないか","学ぶことは喜ばしくない","時が来たら学ぶのをやめる","人に学ばせることだけが大切だ"],a:0,e:"学んだことを折に触れて復習する喜びを述べています。"}
};
let trackKey=null,menuIndex=null,quiz=[],qIndex=0,score=0,answers=[],mode="quiz";
const $=id=>document.getElementById(id);
function show(id){$(id).classList.remove("hidden")}
function hide(id){$(id).classList.add("hidden")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function chooseTrack(key){trackKey=key;const t=TRACKS[key];$("trackName").textContent=t.icon+" "+t.name;$("trackIntro").textContent=t.intro;$("menuGrid").innerHTML=t.menus.map((m,i)=>'<button class="menu-btn" data-menu="'+i+'"><span class="num">'+(i+1)+'</span><span><strong>'+esc(m[0])+'</strong><small>'+esc(m[1])+'</small></span></button>').join("");hide("home");hide("workspace");show("menus");window.scrollTo({top:0,behavior:"smooth"})}
function openMenu(i){menuIndex=i;const t=TRACKS[trackKey];$("workTitle").textContent=(i+1)+". "+t.menus[i][0];$("workBody").innerHTML="";hide("menus");show("workspace");if(i===7)renderSearch();else if(i===4&&trackKey!=="japanese")renderTranslation();else if(i===3&&trackKey==="kanbun")renderTranslation();else if(i===3&&trackKey==="japanese")startQuiz([3]);else if(i===4&&trackKey==="japanese")startQuiz([4,6]);else if(i===6)startQuiz([6]);else if(i===5)startQuiz([0,1,2,3,4,5,6]);else if(i===3&&trackKey==="classic")startQuiz([0,1,2,3]);else startQuiz([i]);window.scrollTo({top:0,behavior:"smooth"})}
function startQuiz(menus){mode="quiz";const pool=DATA[trackKey].filter(q=>menus.includes(q.m));quiz=pool.length?pool.slice():DATA[trackKey].slice();qIndex=0;score=0;answers=[];renderQuestion()}
function renderQuestion(){if(qIndex>=quiz.length){renderResult();return}const q=quiz[qIndex];$("workBody").innerHTML='<div class="row"><span class="tag">'+esc(TRACKS[trackKey].name)+'</span><span class="tag">'+(qIndex+1)+' / '+quiz.length+' 問</span></div><div class="progress"><div style="width:'+(qIndex/quiz.length*100)+'%"></div></div>'+(q.p?'<div class="passage">'+esc(q.p)+'</div>':'')+'<div class="question">'+esc(q.q)+'</div><div class="options">'+q.o.map((o,i)=>'<button class="option" data-answer="'+i+'"><strong>'+(i+1)+'.</strong><span>'+esc(o)+'</span></button>').join("")+'</div><div id="feedback" aria-live="polite"></div><div class="row"><button id="nextQ" class="btn hidden">'+(qIndex===quiz.length-1?'結果を見る':'次の問題へ')+'</button></div>'}
function answerQuestion(n){const q=quiz[qIndex];const ok=n===q.a;if(ok)score++;answers.push({q,selected:n,ok});document.querySelectorAll("[data-answer]").forEach(b=>{b.disabled=true;const v=Number(b.dataset.answer);if(v===q.a)b.classList.add("correct");if(v===n&&!ok)b.classList.add("wrong")});$("feedback").innerHTML='<div class="feedback '+(ok?'good':'bad')+'"><strong>'+(ok?'正解！':'不正解')+'</strong><br>'+esc(q.e||"解説を確認しよう。")+'</div>';$("nextQ").classList.remove("hidden");$("nextQ").onclick=()=>{qIndex++;renderQuestion()}}
function renderResult(){const pct=Math.round(score/quiz.length*100);const misses=answers.filter(a=>!a.ok);$("workBody").innerHTML='<div style="text-align:center;padding:16px"><div class="tag">学習結果</div><div class="stat">'+score+' / '+quiz.length+'</div><h2>'+pct+'%</h2><p class="sub">'+(pct===100?'全問正解！すばらしい！':pct>=70?'いい感じ！間違えた問題を復習しよう。':'解説を読み返して、もう一度挑戦しよう。')+'</p></div><div class="progress"><div style="width:'+pct+'%"></div></div><h3>間違えた問題（'+misses.length+'問）</h3>'+(misses.length?'<ol class="result-list">'+misses.map(a=>'<li><strong>'+esc(a.q.q)+'</strong><br>正解：'+esc(a.q.o[a.q.a])+'<br><span class="muted">'+esc(a.q.e||"")+'</span></li>').join("")+'</ol>':'<p>間違えた問題はないよ！</p>')+'<div class="row"><button class="btn" id="retry">もう一度挑戦</button><button class="btn secondary" id="resultMenus">メニューへ戻る</button></div>';$("retry").onclick=()=>startQuiz([menuIndex]);$("resultMenus").onclick=backMenus}
function renderTranslation(){mode="translation";const p=PASSAGES[trackKey];$("workBody").innerHTML='<p class="sub">本文を読んで、自分の言葉で訳や意味を書いてから、解答例を確認しよう。</p><h3>'+esc(p.title)+'</h3><div class="passage">'+esc(p.text)+'</div><label for="translationAnswer"><strong>'+(trackKey==="classic"?"現代語訳":trackKey==="kanbun"?"書き下し・現代語訳":"本文の要約")+'を入力</strong></label><textarea id="translationAnswer" class="input" rows="4" placeholder="自分の訳・要約を入力しよう"></textarea><div class="row" style="margin-top:12px"><button class="btn" id="showModel">解答例・ポイントを見る</button></div><div id="modelAnswer"></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>内容理解の確認</h3><p class="question">'+esc(p.q)+'</p><div class="options">'+p.o.map((o,i)=>'<button class="option" data-trans="'+i+'">'+(i+1)+'. '+esc(o)+'</button>').join("")+'</div><div id="transFeedback"></div>';$("showModel").onclick=()=>{$("modelAnswer").innerHTML='<div class="feedback"><strong>解答例・ポイント</strong><p>'+esc(p.e)+'</p></div>'};document.querySelectorAll("[data-trans]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-trans]").forEach(x=>x.disabled=true);const ok=Number(b.dataset.trans)===p.a;b.classList.add(ok?"correct":"wrong");$("transFeedback").innerHTML='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?'正解！':'もう一度、本文を確認しよう。')+'<br>'+esc(p.e)+'</div>'})}
function renderSearch(){mode="search";const terms=TERMS[trackKey];$("workBody").innerHTML='<p class="sub">単語を入力すると、登録されている意味が表示されるよ。ひらがな・漢字の一部でも検索できます。</p><div class="answer-line"><input class="input" id="termInput" placeholder="'+(trackKey==="classic"?"例：あはれなり、けり":trackKey==="kanbun"?"例：故人、而":"例：簡潔、妥当")+'" autocomplete="off"><button class="btn" id="termSearch">意味を調べる</button></div><div class="row" style="margin-top:10px"><button class="btn ghost" id="showAllTerms">登録語句を一覧表示</button></div><div class="search-results" id="termResults"></div>';$("termSearch").onclick=searchTerms;$("termInput").addEventListener("keydown",e=>{if(e.key==="Enter")searchTerms()});$("showAllTerms").onclick=()=>showTerms(terms)}
function searchTerms(){const word=$("termInput").value.trim();if(!word){$("termResults").innerHTML='<p class="muted">調べたい単語を入力してね。</p>';return}const found=TERMS[trackKey].filter(t=>t[0].includes(word)||t[1].includes(word));showTerms(found,word)}
function showTerms(terms,word=""){ $("termResults").innerHTML=terms.length?terms.map(t=>'<div class="term-card"><strong>'+esc(t[0])+'</strong><div>'+esc(t[1])+'</div></div>').join(""):'<div class="feedback">「'+esc(word)+'」に一致する登録語句は見つかりませんでした。表記を変えて試してね。<br><small>登録語句は学習用サンプルです。すべての単語を網羅しているわけではありません。</small></div>'}
function backMenus(){hide("workspace");show("menus");window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll("[data-track]").forEach(b=>b.addEventListener("click",()=>chooseTrack(b.dataset.track)));
$("backHome").addEventListener("click",()=>{hide("menus");hide("workspace");show("home");window.scrollTo({top:0,behavior:"smooth"})});
$("toMenus").addEventListener("click",backMenus);
$("menuGrid").addEventListener("click",e=>{const b=e.target.closest("[data-menu]");if(b)openMenu(Number(b.dataset.menu))});
$("workBody").addEventListener("click",e=>{const b=e.target.closest("[data-answer]");if(b&&!b.disabled)answerQuestion(Number(b.dataset.answer))});
</script>
</body>
</html>
