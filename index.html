const $=id=>document.getElementById(id);
let subject='classical',selectedMenu=0,quiz=null,picked=null,answered=false,quizItems=[],quizIndex=0,quizScore=0,quizMiss=[];
function safe(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function renderMenus(){
 const grid=$('menu-grid');grid.innerHTML='';
 subjects[subject].menus.forEach((m,i)=>{const b=document.createElement('button');b.type='button';b.className='menu';b.innerHTML='<span class="tag">MENU '+(i+1)+'</span><strong>'+(i+1)+'. '+safe(m[0])+'</strong><span>'+safe(m[1])+'</span>';b.addEventListener('click',()=>openMenu(i));grid.appendChild(b)});
 $('menu-title').textContent='STEP 2｜'+subjects[subject].name+'の学習メニューを選ぶ';
}
document.querySelectorAll('[data-subject]').forEach(b=>b.addEventListener('click',()=>{subject=b.dataset.subject;document.querySelectorAll('[data-subject]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderMenus();$('work').classList.add('hidden');}));
$('back-menu').addEventListener('click',()=>{$('work').classList.add('hidden');$('menu-grid').scrollIntoView({block:'nearest'});});
function begin(title,content){$('work').classList.remove('hidden');$('work-tag').textContent=subjects[subject].name+' · MENU '+(selectedMenu+1);$('work-title').textContent=title;$('work-content').replaceChildren();$('work-content').appendChild(content);$('work').scrollIntoView({behavior:'smooth',block:'start'});}
function node(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}
function openMenu(i){selectedMenu=i;const content=node('div');const name=subjects[subject].menus[i][0];
 if(i===7){termSearch(content);begin('単語検索｜入力して意味を調べる',content);return}
 if(subject==='classical'&&i===4){translation(content,'classical');begin('古典｜本文翻訳',content);return}
 if(subject==='kanbun'&&i===3){translation(content,'kanbun');begin('漢文｜本文翻訳',content);return}
 if((subject==='japanese'&&i===3)){shortQuestions(content);begin('国語｜短文問題',content);return}
 if((subject==='japanese'&&i===4)||(subject==='kanbun'&&i===4)){readingQuestion(content);begin(subjects[subject].name+'｜本文読解・四択問題',content);return}
 if(i===5||i===6){startTest(content,i===5?'mock':'common');begin(subjects[subject].name+'｜'+(i===5?'模擬テスト':'共通テスト型演習'),content);return}
 startPractice(content,i,name);begin(subjects[subject].name+'｜'+name,content);
}
function makeQuizCard(parent,items,title){let idx=0,score=0,selected=null,done=false,miss=[];const card=node('div');const heading=node('p','muted',title||'選択肢を選び、採点して解説を確認しよう。');const progress=node('div','progress');const bar=node('div');progress.appendChild(bar);const q=node('div','question-title');const options=node('div');const feedback=node('div','feedback','選択肢を選んでください。');const stats=node('p','muted','');const actions=node('div','row');const check=node('button','primary','採点する');const next=node('button','secondary','次の問題');actions.append(check,next);card.append(heading,progress,q,options,feedback,stats,actions);parent.appendChild(card);
 function draw(){selected=null;done=false;const item=items[idx];q.textContent=(idx+1)+'. '+item.q;options.replaceChildren();item.c.forEach((v,j)=>{const b=node('button','option',String.fromCharCode(65+j)+'. '+v);b.type='button';b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{if(done)return;selected=j;[...options.children].forEach((x,k)=>x.setAttribute('aria-pressed',String(k===j)));feedback.textContent='選択肢を選びました。採点して確認しよう。';});options.appendChild(b)});feedback.className='feedback';feedback.textContent='選択肢を選んでください。';bar.style.width=(idx/items.length*100)+'%';stats.textContent='問題 '+(idx+1)+' / '+items.length+'　正解 '+score+'問';check.disabled=false;}
 check.addEventListener('click',()=>{if(done)return;if(selected===null){feedback.textContent='先に選択肢を選んでください。';return}done=true;const item=items[idx];if(selected===item.a)score++;else miss.push(item);feedback.className='feedback '+(selected===item.a?'correct':'wrong');feedback.textContent=(selected===item.a?'正解！\n':'不正解。\n')+'正解：'+item.c[item.a]+'\n解説：'+item.e;stats.textContent='正解 '+score+' / 解答 '+(idx+1)+'問（正答率 '+Math.round(score/(idx+1)*100)+'%）';bar.style.width=((idx+1)/items.length*100)+'%';check.disabled=true;if(idx===items.length-1){next.textContent='結果を見る';}});
 next.addEventListener('click',()=>{if(!done&&selected!==null){feedback.textContent='先に採点してください。';return}if(idx<items.length-1){idx++;draw()}else{card.replaceChildren();card.appendChild(node('h3','', '結果：'+score+' / '+items.length+'問正解'));card.appendChild(node('p','big','正答率 '+Math.round(score/items.length*100)+'%'));if(miss.length){card.appendChild(node('h3','','復習したい問題'));miss.forEach(m=>{const box=node('div','term-result');box.append(node('strong','',m.q),node('p','', '正解：'+m.c[m.a]),node('p','muted','解説：'+m.e));card.appendChild(box)})}else card.appendChild(node('p','', '全問正解！この調子で別のメニューにも挑戦しよう。'));const retry=node('button','primary','もう一度挑戦');retry.addEventListener('click',()=>makeQuizCard(parent,items,title));card.appendChild(retry)}});
 draw();return card;
}
function startPractice(parent,i,name){let items=db[subject].filter(q=>q.type===i);if(!items.length)items=db[subject].filter(q=>q.type===0||q.type===1);if(i===0&&subject==='classical')items=db.classical.filter(q=>q.type===0);const lead=node('p','muted',({0:'基本用語を理解し、活用や読みを確認しよう。',1:'意味・接続・使い方をセットで覚えよう。',2:'働きや意味を文脈から判断しよう.',3:'似た語や文法を比較して見分けよう.'})[i]||'問題を解き、根拠と解説を確認しよう。');parent.appendChild(lead);makeQuizCard(parent,items,name);}
function startTest(parent,mode){let items;if(mode==='mock'){items=db[subject].slice(0,Math.min(8,db[subject].length))}else{items=db[subject].filter(q=>q.type>=4).concat(db[subject].filter(q=>q.type===3)).slice(0,6)}if(!items.length)items=db[subject].slice(0,6);parent.appendChild(node('p','notice',mode==='mock'?'分野を横断する模擬テストです。最後に正答率と復習問題が表示されます。':'本文や知識を根拠に判断する共通テスト型の練習です。'));makeQuizCard(parent,items,mode==='mock'?'模擬テスト':'共通テスト型');}
function translation(parent,kind){const data=translations[kind];parent.appendChild(node('p','muted','本文を読んで、現代語訳として最も適切なものを選びましょう。'));parent.appendChild(node('div','term-result',data.text));makeQuizCard(parent,[{q:data.question,c:data.c,a:data.a,e:data.e}],data.title);}
function shortQuestions(parent){const items=db.japanese.filter(q=>q.type===3);parent.appendChild(node('p','muted','短い文章の表現・接続関係を読み取る練習です。'));makeQuizCard(parent,items,'短文読解');}
function readingQuestion(parent){const data=subject==='kanbun'?translations.kanbun: {text:'ある文章で、筆者は「地域の図書館は本を貸し出すだけでなく、人々が知識を共有し、交流する場所でもある」と述べている。',question:'この文から読み取れる内容として最も適切なものは？',c:['図書館の役割は本の貸し出しだけではない','図書館は本を貸し出してはいけない','人々は図書館で交流できない','知識を共有する必要はない'],a:0,e:'本文は、本の貸し出しに加えて、知識共有や人々の交流も図書館の役割だと述べています。'};parent.appendChild(node('p','muted','本文の内容に合う選択肢を、本文中の根拠から選ぼう。'));parent.appendChild(node('div','term-result',data.text));makeQuizCard(parent,[{q:data.question,c:data.c,a:data.a,e:data.e}], '本文読解');}
function termSearch(parent){parent.appendChild(node('p','muted','古典・国語・漢文の語句を横断して検索できます。単語を入力すると意味が表示されます。'));const input=node('input');input.type='search';input.placeholder='例：あはれ、示唆、未、温故知新';input.setAttribute('aria-label','検索する単語');const results=node('div');const all=node('button','secondary','すべての単語を見る');all.type='button';parent.append(input,all,results);function search(){const word=input.value.trim().toLowerCase();const matches=terms.filter(t=>!word||t[1].toLowerCase().includes(word)||t[2].toLowerCase().includes(word));results.replaceChildren();if(!matches.length){results.appendChild(node('p','feedback','見つかりませんでした。別の表記で検索してみてください。'));return}matches.forEach(t=>{const box=node('article','term-result');box.append(node('span','tag',t[3]),node('h3','',t[1]),node('p','',t[2]));results.appendChild(box)});if(word)results.prepend(node('p','muted',matches.length+'件見つかりました。'))}input.addEventListener('input',search);all.addEventListener('click',()=>{input.value='';search()});search();}
renderMenus();
