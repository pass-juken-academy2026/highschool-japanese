</style></head><body><main><div class="top"><a href="./index.html">← 科目トップへ戻る</a><span class="pill">オリジナル問題</span></div><h1>高校国語 演習ラボ</h1><p class="muted">知識の確認から資料・文章を読み取る問題まで。解答後に採点し、解説と復習問題を確認できます。</p><section class="panel" id="setup"><h2>演習を設定</h2><p class="route-note">模擬テスト・共通テスト型は、問題数と本文を統一したテスト画面で実施します。下のリンクから直接開けます。</p><div class="mode-links"><a class="mode-link" href="./index.html?subject=japanese&amp;mode=mock">模擬テスト（全10問）</a><a class="mode-link" href="./index.html?subject=japanese&amp;mode=common">共通テスト型（全37問）</a></div><label for="mode">演習モード</label><select id="mode"><option value="common">共通テスト型（全37問）</option><option value="mock">模擬テスト（全10問）</option><option value="basic">基礎確認</option></select><p id="modeInfo" class="muted">基礎確認はこの画面で実施。模擬・共通テスト型は上の統一テスト画面を使用します。</p><button id="start">テストを開始</button></section><section class="panel hidden" id="quiz" aria-live="polite"><div class="top"><span id="counter" class="pill"></span><span id="scoreLive" class="muted"></span></div><div class="progress"><span id="bar"></span></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="explain hidden"></div><div class="row" style="margin-top:18px"><button id="check">解答する</button><button id="next" disabled>次の問題 →</button></div></section><section class="panel hidden" id="result"><h2>結果・弱点分析</h2><p id="summary"></p><p id="analysis" class="muted"></p><h3>間違えた問題</h3><div id="missed"></div><div class="row"><button id="review">間違えた問題を復習</button><button id="again">もう一度挑戦</button></div></section><p class="muted">※本番問題の転載ではなく、学習用に作成したオリジナル問題です。出題範囲は今後拡充します。</p></main><script>
const BANK=[["「しかし」が文章中で示す関係として最も適切なのは？",["理由","逆接","具体例","結論"],1,"前の内容と反対・対比する内容をつなぐ逆接の接続語。"],["評論文で筆者の主張をつかむ方法として最も適切なのは？",["例だけを読む","接続語や結論付近を手がかりに論理を追う","知らない語を飛ばして結論を決める","最初の一文だけで判断する"],1,"対比・因果・言い換え、結論部分を手がかりに文章全体の論理を追う。"],["「杞憂」の意味は？",["必要な準備","取り越し苦労","強い決意","昔の習慣"],1,"起こる可能性の低いことをあれこれ心配すること。"],["「敷衍」の読みとして正しいものは？",["ふえん","しきえん","ふいん","しゅうえん"],0,"敷衍（ふえん）は、説明などを広げて詳しく述べること。"],["文章で具体例が置かれる主な役割は？",["主張を必ず否定する","抽象的な説明を分かりやすく補う","結論を無関係にする","筆者の立場を隠す"],1,"具体例は抽象的な主張や概念を理解しやすくするために使われる。"],["本文に『AではなくB』とあるとき、最も注目すべき点は？",["AとBの対比軸","登場人物の年齢","文章の文字数","段落の行数"],0,"否定されたAと強調されるBの対比が筆者の主張を示すことがある。"],["【短文読解】文章：『便利な道具は時間を節約する。しかし、節約した時間を何に使うかを考えなければ、生活が豊かになったとは限らない。』この文章の主張は？",["便利な道具は使うべきではない","時間の節約だけでなく、その使い方も大切だ","生活の豊かさは時間と無関係だ","道具が増えるほど必ず幸福になる"],1,"逆接の「しかし」以降で、時間を節約した後の使い方も重要だと主張している。"],["【資料読解】ある学校で読書時間の平均が、4月は週45分、7月は週60分、10月は週75分だった。この資料から確実に言えることは？",["全生徒の読書時間が増えた","平均読書時間は調査時点ごとに増加した","読書時間が増えた原因は図書館だ","全員が週75分読んだ"],1,"平均値の変化は読み取れるが、個々の生徒の変化や原因までは断定できない。"],["【論理】筆者が『一見矛盾する二つの意見を、前提の違いに注目して整理する』と述べた。行うべきことは？",["片方を最初から誤りとする","両意見が何を前提にしているか比較する","意見の数だけ数える","結論を読まずに判断する"],1,"議論の前提や用語の意味をそろえることで、違いの理由を検討できる。"],["【語彙】『普遍的』の意味に最も近いものは？",["特定の一人だけに当てはまる","広く全体に共通して当てはまる","一時的に変化する","証拠がない"],1,"普遍的は、広く一般に共通して当てはまること。"],["【論理読解】筆者が具体例の後に『つまり』と述べた場合、最も適切な読み方は？",["直前の具体例を否定している","具体例を受けて要点をまとめている","話題を必ず変えている","原因と結果を逆にしている"],1,"『つまり』は、前の内容をまとめたり言い換えたりする働きを持つ。"],["【根拠読解】設問が『本文から読み取れること』を尋ねているとき、最も適切な解き方は？",["自分の経験に合う選択肢を選ぶ","本文中の根拠と選択肢の内容を照合する","一番詳しい選択肢を選ぶ","筆者の意図を想像だけで決める"],1,"本文の記述を根拠にして、選択肢が言い過ぎていないかも確認する。"],["【段落構成】段落の冒頭に『このような問題を解決するには』とある場合、前段落との関係として考えやすいものは？",["前段落で示した問題への対応策を述べる","必ず無関係な話題へ移る","前段落の数字を繰り返すだけ","文章全体の結論を否定する"],0,"指示語『このような問題』が何を指すかを前段落に戻って確認する。"],["【資料読解】調査結果で『回答者の60％がAを選んだ』とある。この情報だけから言えないことは？",["回答者の過半数がAを選んだ","Aが回答者の中で最も人気だ（他の選択肢の割合が不明な場合）","回答者の60％がAを選んだ","回答者の割合として60％が示された"],1,"A以外の選択肢の割合が示されていないなら、Aが最も多いとは断定できない。"],["【表現読解】文章中の『たとえば』の主な働きは？",["前の説明に具体例を示す","必ず反対意見を示す","文章の結論を取り消す","時間の順序を示す"],0,"『たとえば』は、前に述べた内容を具体例で説明する合図。"],["【要旨把握】文章の要旨をまとめるとき、最も適切な方法は？",["細かな例をすべて書き写す","中心的な主張と、それを支える重要な理由を選ぶ","最初の一文だけをそのまま使う","自分の感想を中心にする"],1,"要旨は中心的な主張を軸に、必要な理由や説明を選んで簡潔にまとめる。"],["【古文文法】古文の助動詞「ず」の基本的な意味は？",["完了","打消","推量","過去"],1,"助動詞「ず」は基本的に打消を表す。接続や活用も合わせて確認しよう。"],["【古文文法】係助詞「ぞ」が文中にあり、係り結びが成立しているとき、文末の活用形は原則どれ？",["未然形","連用形","連体形","已然形"],2,"係助詞「ぞ・なむ・や・か」は、係り結びで文末が連体形になる。"],["【漢文】「未だ〜ず」の「未」が表す意味として最も適切なのは？",["すでに〜した","まだ〜していない","必ず〜する","どうして〜するか"],1,"「未」は「いまだ〜ず」と読み、まだ実現していないことを表す。"],["【漢文句法】漢文の返り点「レ点」の読み方は？",["上の字を先に読み、下の字へ進む","一字下の字を読んでから、レ点の字に返って読む","必ず二字を飛ばして読む","文末まで読んでから最初に戻る"],1,"レ点は、すぐ下の字を先に読み、その後でレ点の付いた字に返って読む。"]
]; 
const $=id=>document.getElementById(id);let questions=[],idx=0,answers=[],locked=false,reviewOnly=false;
const modes={common:"知識・読解・資料活用を組み合わせたオリジナル問題",mock:"模擬テストは1題です。解答と解説で理解を確認します",basic:"重要用語・基本事項をテンポよく確認します"};
$("mode").addEventListener("change",()=> $("modeInfo").textContent=modes[$("mode").value]);
// practice-mode-from-menu-20261010: honor the mode selected on the existing study menu
(function(){const p=new URLSearchParams(location.search),v=p.get("mode"),t=p.get("topic"),label=p.get("label");if(["common","mock","basic"].includes(v))$("mode").value=v;$("modeInfo").textContent=modes[$("mode").value]||modes.basic;if(t){const h=document.querySelector("header h1, h1");if(h)h.textContent=(label||"演習")+"｜"+t;}})();

const COMMON_STIMULUS={title:"【大問1 読書時間と理解度】",text:"ある学校で、1週間の読書時間と読解確認テストの平均点を調べた。これは学習用の模式データであり、因果関係を直接証明するものではない。",table:"<table><tr><th>読書時間（分/週）</th><th>30</th><th>60</th><th>90</th></tr><tr><th>平均点（点）</th><td>62</td><td>70</td><td>76</td></tr></table>"};
const COMMON_TEST=[["【大問1・問1】資料から読み取れる傾向として適切なのは？",["読書時間が長い群ほど平均点が高い","読書時間が長い群ほど平均点が低い","全群の平均点は同じ","読書時間と平均点の関係は資料から一切読めない"],0,"示された3群では、読書時間が増えるにつれて平均点も高くなっている。"],["【大問1・問2】この資料だけで断定できないことは？",["各群の平均点","調査した読書時間","読書時間が点数上昇の唯一の原因であること","群ごとの数値の比較"],2,"他の学習習慣や元々の読解力などが統制されているとは限らず、因果関係は断定できない。"],["【大問1・問3】読書時間の影響をより確かめる調査として適切なのは？",["対象人数や他の条件を記録し、複数回調べる","最も高い点数の人だけを選ぶ","低い点数の記録を除く","結果を見ずに結論を決める"],0,"人数・背景条件・測定方法をそろえて追加調査し、結果の再現性を確かめる。"]];
function start(list=null,review=false){const mode=$("mode").value;if(!list&&(mode==="common"||mode==="mock")){location.href="./index.html?subject=japanese&mode="+mode;return;}let source=list||BANK;if(!list&&mode==="basic")source=BANK.slice(0,6);if(!list&&mode==="common")source=COMMON_TEST;if(!list&&mode==="mock")source=[...BANK];questions=[...source].sort(()=>Math.random()-.5);if(!list&&mode==="mock")questions=questions.slice(0,1);if(!questions.length)questions=[...BANK];idx=0;answers=[];locked=false;reviewOnly=review;$("setup").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()}
function render(){const q=questions[idx];locked=false;$("counter").textContent=(idx+1)+" / "+questions.length;$("scoreLive").textContent="回答済み "+answers.filter(a=>a&&a.selected!==undefined).length+"問";$("bar").style.width=(idx/questions.length*100)+"%";const qel=$("question");let st=$("commonStimulus");if(!st){st=document.createElement("section");st.id="commonStimulus";st.className="panel";qel.parentNode.insertBefore(st,qel);}const cm=$("mode").value==="common";st.style.display=cm?"block":"none";st.innerHTML=cm?"<h3>"+COMMON_STIMULUS.title+"</h3><p>"+COMMON_STIMULUS.text+"</p>"+COMMON_STIMULUS.table:"";$("question").textContent=q[0];$("choices").innerHTML="";q[1].forEach((t,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=["A","B","C","D"][i]+"．"+t;b.addEventListener("click",()=>{if(locked)return;answers[idx]={selected:i};[...$("choices").children].forEach(x=>x.classList.remove("selected"));b.classList.add("selected")});$("choices").appendChild(b)});$("feedback").classList.add("hidden");$("feedback").textContent="";$("check").disabled=false;$("next").disabled=true;$("next").textContent=idx===questions.length-1?"結果を見る":"次の問題 →"}
$("start").addEventListener("click",()=>start());
$("check").addEventListener("click",()=>{if(locked)return;if(!answers[idx]||answers[idx].selected===undefined){$("feedback").textContent="選択肢を選んでね。";$("feedback").classList.remove("hidden");return}locked=true;const q=questions[idx],a=answers[idx];a.correct=a.selected===q[2];[...$("choices").children].forEach((b,i)=>{b.disabled=true;if(i===q[2])b.classList.add("correct");if(i===a.selected&&i!==q[2])b.classList.add("wrong")});$("feedback").textContent=(a.correct?"正解！":"不正解。正解は "+["A","B","C","D"][q[2]]+"。")+" "+q[3];$("feedback").classList.remove("hidden");$("check").disabled=true;$("next").disabled=false;$("scoreLive").textContent="現在 "+answers.filter(x=>x&&x.correct).length+"問正解"});
$("next").addEventListener("click",()=>{if(idx<questions.length-1){idx++;render()}else finish()});
function finish(){ $("quiz").classList.add("hidden");$("result").classList.remove("hidden");const good=answers.filter(a=>a&&a.correct).length;const wrong=questions.map((q,i)=>({q,a:answers[i]})).filter(x=>!x.a||!x.a.correct);$("summary").textContent=good+" / "+questions.length+"問正解（正答率 "+Math.round(good/questions.length*100)+"%）";$("analysis").textContent=good===questions.length?"全問正解！知識だけでなく、根拠を説明できるかも確認しよう。":wrong.length+"問を復習リストに入れました。解説を読み、なぜその選択肢が正しいかを自分の言葉で説明してみよう。";$("missed").innerHTML=wrong.length?wrong.map(x=>'<div class="explain" style="margin:10px 0"><strong>'+x.q[0]+'</strong><p>正解：'+x.q[1][x.q[2]]+'</p><p>'+x.q[3]+'</p></div>').join(""):"間違えた問題はありません。";$("review").disabled=!wrong.length;$("review").onclick=()=>start(wrong.map(x=>x.q),true);$("again").onclick=()=>start()}
/* practice-query-autostart */const qp=new URLSearchParams(window.location.search);const requestedMode=qp.get("mode");if(["common","mock","basic"].includes(requestedMode)){$("mode").value=requestedMode;}if(qp.get("autostart")==="1"){start();}</script></body></html>
