name: Validate static site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check HTML and inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess, sys, tempfile
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.ids=[]; self.scripts=[]; self.in_script=False; self.buf=[]; self.errors=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if 'id' in a: self.ids.append(a['id'])
                  if tag=='script': self.in_script=True; self.buf=[]
              def handle_data(self, data):
                  if self.in_script: self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag=='script' and self.in_script:
                      self.scripts.append(''.join(self.buf)); self.in_script=False
          files=list(Path('.').rglob('*.html'))
          if not files: print('No HTML files found'); sys.exit(1)
          failed=False
          for f in files:
              a=Audit()
              try: a.feed(f.read_text(encoding='utf-8'))
              except Exception as e: print(f'HTML parse error {f}: {e}'); failed=True; continue
              dup=sorted({i for i in a.ids if a.ids.count(i)>1})
              if dup: print(f'Duplicate IDs in {f}: {dup}'); failed=True
              for n,js in enumerate(a.scripts):
                  if not js.strip(): continue
                  p=Path(tempfile.gettempdir())/f'inline-{abs(hash((str(f),n)))}.js'
                  p.write_text(js,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                  if r.returncode: print(f'JavaScript syntax error in {f} script {n+1}:\n{r.stderr}'); failed=True
              print(f'Checked {f}: {len(a.scripts)} inline script(s), {len(a.ids)} IDs')
          if failed: sys.exit(1)
          PY

      - name: Check Stage 2 Japanese feature coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          source = Path('index.html').read_text(encoding='utf-8')
          required = [
              '本文の根拠を探す',
              '現代文の誤答分析',
              '古文単語',
              '助動詞・敬語',
              '敬語・主語判定',
              '句形・置き字',
              '返り点・書き下し文',
              '記述答案の採点・改善',
              'function modernEvidencePractice(',
              'function modernWrongAnswerAnalysis(',
              'function classicalContextVocab(',
              'function classicalGrammarDrill(',
              'function classicalSubjectInference(',
              'function kanbunPatternDrill(',
              'function kanbunConversionDrill(',
              'function writingPractice(',
              '改善ポイント',
              '採点基準（3点満点）',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              print('Missing Stage 2 Japanese coverage:')
              print("\n".join(missing))
              sys.exit(1)
          print(f'Checked {len(required)} Stage 2 Japanese coverage markers')
          PY
      - name: Validate Stage 2 Japanese coverage and answer data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          page = Path('index.html').read_text(encoding='utf-8')
          practice = Path('practice.html').read_text(encoding='utf-8')
          functions = [
              'modernEvidencePractice', 'modernWrongAnswerAnalysis',
              'classicalContextVocab', 'classicalGrammarDrill',
              'classicalParticleDrill', 'classicalSentenceBreakdown',
              'classicalSubjectInference', 'kanbunPatternDrill',
              'kanbunConversionDrill', 'writingPractice'
          ]
          markers = [
              '本文の根拠', '誤答の原因', 'いとど', 'ゆめ', 'る・らる',
              'べし', '尊敬語', '謙譲語', '主語判定', '二重否定',
              '反語', '所以', 'レ点', '書き下し文', '採点基準',
              '改善ポイント'
          ]
          missing = [x for x in functions if 'function ' + x + '(' not in page]
          missing += [x for x in markers if x not in page]
          if missing:
              print('Missing Stage 2 Japanese coverage: ' + ', '.join(missing))
              sys.exit(1)
          quiz_re = re.compile(r"\{q:'([^']*)',c:\[([^\]]*)\],a:(\d+),e:'([^']*)'\}")
          quizzes = quiz_re.findall(page)
          errors = []
          for n, (_, raw_choices, raw_answer, explanation) in enumerate(quizzes, 1):
              choices = re.findall(r"'([^']*)'", raw_choices)
              answer = int(raw_answer)
              if len(choices) < 2 or answer >= len(choices) or len(explanation.strip()) < 8:
                  errors.append(f'index.html quiz {n}: choices={len(choices)}, answer={answer}')
          evidence_start = page.find('function modernEvidencePractice')
          evidence_end = page.find('function modernWrongAnswerAnalysis', evidence_start)
          evidence_fn = page[evidence_start:evidence_end] if evidence_start >= 0 and evidence_end > evidence_start else ''
          evidence_re = re.compile(r"opts:\[([^\]]*)\],a:(\d+),\s*lines:\[([^\]]*)\],e:(\d+),")
          evidence = evidence_re.findall(evidence_fn)
          for n, (raw_opts, raw_answer, raw_lines, raw_evidence) in enumerate(evidence, 1):
              opts = re.findall(r"'([^']*)'", raw_opts)
              lines = re.findall(r"'([^']*)'", raw_lines)
              if int(raw_answer) >= len(opts) or int(raw_evidence) >= len(lines) or not opts or not lines:
                  errors.append(f'modern evidence item {n}: answer/evidence index out of range')
          bank_match = re.search(r'const BANK=\[(.*?)\];\s*let idx', practice, re.S)
          bank = []
          if bank_match:
              bank_re = re.compile(r'\["([^"]*)",\[([^\]]*)\],(\d+),"([^"]*)"\]')
              bank = bank_re.findall(bank_match.group(1))
              for n, (_, raw_choices, raw_answer, explanation) in enumerate(bank, 1):
                  choices = re.findall(r'"([^"]*)"', raw_choices)
                  answer = int(raw_answer)
                  if len(choices) < 2 or answer >= len(choices) or len(explanation.strip()) < 8:
                      errors.append(f'practice.html quiz {n}: choices={len(choices)}, answer={answer}')
          if not bank:
              errors.append('practice.html question bank was not found')
          if errors:
              print('Invalid Japanese question data:')
              print('\n'.join(errors))
              sys.exit(1)
          print(f'Stage 2 Japanese coverage OK; index quiz records: {len(quizzes)}; evidence items: {len(evidence)}; practice quiz records: {len(bank)}')
          PY
